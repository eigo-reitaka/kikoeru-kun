<style>

.btn{display:flex;justify-content:center;align-items:center;gap:8px;width:100%;padding:16px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;text-align:center}

.wpmbar{position:relative;height:58px;margin:10px 16px 0}

.wpmbar i b{display:block;font-family:var(--jp);font-size:11px}

.logo{font-size:46px;font-weight:900;line-height:1.1;letter-spacing:.02em;color:var(--accent);margin:0}

.rvq{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.rvb{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.rvm{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:15px}
.rvm.o{background:var(--ok-bg);color:var(--ok)}.rvm.x{background:var(--bg);color:var(--ng);border:2px solid var(--ng)}
.rva{font-size:15px;margin:0}.rvy{font-size:14px;color:var(--ng);margin:0}
.rvp summary{cursor:pointer;font-weight:700;color:var(--accent);padding:6px 0}
.dic{cursor:pointer;-webkit-tap-highlight-color:transparent}
.dhl{background:var(--accent-soft);color:var(--accent);border-radius:4px;box-shadow:0 0 0 2px var(--accent-soft)}
.dsheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(0,0,0,.12);border-radius:18px 18px 0 0;padding:16px max(20px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow:auto;max-width:560px;margin:0 auto}
.dhd{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dw{font-family:var(--en);font-size:26px;font-weight:700;margin:0;color:var(--accent);word-break:break-word}
.dx{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;color:var(--sub);flex:none}
.dbase{margin:0;font-size:14px;color:var(--sub)}.dbase b{font-family:var(--en);color:var(--ink);font-size:16px}
.dm{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.6}
.dph{background:var(--accent-soft);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px}
.dphl{font-size:12px;font-weight:700;color:var(--accent)}.dpht{margin:0;font-family:var(--en);font-size:19px;font-weight:700}.dpht small{font-family:inherit;font-size:13px;font-weight:500;color:var(--sub);margin-left:6px}
.dphm{margin:0;font-size:16px;font-weight:700}.dsub{margin:4px 0 0;font-size:12px;font-weight:700;color:var(--sub)}
.dm0{margin:0;font-size:15px}.dnote{margin:2px 0 0;font-size:12px;color:var(--dim)}
.rv{border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.ens{font-family:var(--en);font-size:22px;line-height:1.6;font-weight:500}
.ens .dim{color:var(--dim)}
.ens b,.sw{color:var(--accent);font-weight:700}
.kana{font-size:17px;font-weight:700;line-height:1.5}
.ja{font-size:14px;color:var(--sub);line-height:1.6}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp button{background:var(--soft);border-radius:14px;padding:11px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}

.tag{align-self:flex-start;font-size:12.5px;font-weight:700;border-radius:8px;padding:3px 9px}

.mk{border-radius:5px;padding:1px 4px;font-weight:600;cursor:pointer;border-bottom:2px solid currentColor;box-decoration-break:clone;-webkit-box-decoration-break:clone}

  for(const x of a){const t=new Date(x+"T12:00:00");run=prev&&Math.round((t-prev)/864e5)===1?run+1:1;best=Math.max(best,run);prev=t}return best}

/* ===== 単語の辞書 ===== */
const WRE=/[A-Za-z'’-]/;
function dictFind(w){const k=w.toLowerCase().replace(/’/g,"'").replace(/^[-']+|[-']+$/g,"");const i=D.dict.w[k];return i==null?null:{w:k,h:D.dict.m[i][0],m:D.dict.m[i][1]}}
function wordAt(x,y){let node,off;
  if(document.caretPositionFromPoint){const c=document.caretPositionFromPoint(x,y);if(!c)return null;node=c.offsetNode;off=c.offset}
  else if(document.caretRangeFromPoint){const r=document.caretRangeFromPoint(x,y);if(!r)return null;node=r.startContainer;off=r.startOffset}
  if(!node||node.nodeType!==3)return null;const t=node.data;let a=off,b=off;
  if(!WRE.test(t[a]||"")&&WRE.test(t[a-1]||""))a=b=off-1;
  if(!WRE.test(t[a]||""))return null;while(a>0&&WRE.test(t[a-1]))a--;while(b<t.length&&WRE.test(t[b]))b++;
  while(a<b&&/['’-]/.test(t[a]))a++;while(b>a&&/['’-]/.test(t[b-1]))b--;if(a>=b)return null;
  const r=document.createRange();r.setStart(node,a);r.setEnd(node,b);
  const rc=r.getBoundingClientRect();if(x<rc.left-6||x>rc.right+6||y<rc.top-6||y>rc.bottom+6)return null;return {r,w:t.slice(a,b)}}
const DET=new Set("the a an my your his her its our their this that these those some every everyone's someone's".split(" "));
const PRON=new Set("it them him her me us you this that".split(" "));
function lemOf(t){const f=dictFind(t);return f?f.h.toLowerCase():t}
function phraseAt(el,range){
  try{const pre=document.createRange();pre.setStart(el,0);pre.setEnd(range.startContainer,range.startOffset);
  const off=pre.toString().length,txt=el.textContent;
  let toks=[],m,re=/[A-Za-z'’]+|[.!?;:"“”]/g;while(m=re.exec(txt))toks.push({t:m[0].toLowerCase().replace(/’/g,"'"),a:m.index,b:m.index+m[0].length});
  let ti=toks.findIndex(x=>off>=x.a&&off<x.b);if(ti<0)return null;
  let s=ti,e=ti;while(s>0&&!/^[.!?;:"“”]$/.test(toks[s-1].t))s--;while(e<toks.length-1&&!/^[.!?;:"“”]$/.test(toks[e+1].t))e++;
  const T=toks.slice(s,e+1),me=ti-s,L=T.map(x=>lemOf(x.t));let best=null;
  for(const [pat,mean] of D.dict.p){const ps=pat.split(" ");
    for(let i=0;i<T.length;i++){let j=i,k=0,idx=[],ok=true;
      while(k<ps.length){const p=ps[k];
        if(p==="~ing"){if(j<T.length&&/ing$/.test(T[j].t)){idx.push(j);j++;k++;continue}ok=false;break}
        if(p==="~"){const nx=ps[k+1];let g=-1;
          if(j<T.length&&PRON.has(T[j].t)&&j+1<T.length&&(T[j+1].t===nx||L[j+1]===nx))g=1;
          else if(j+1<T.length&&DET.has(T[j].t)&&j+2<T.length&&(T[j+2].t===nx||L[j+2]===nx))g=2;
          else if(j<T.length&&(T[j].t===nx||L[j]===nx))g=0;
          if(g<0){ok=false;break}
          const pj=j+g;if(g>0&&pj+1<T.length&&(DET.has(T[pj+1].t)||/'s$/.test(T[pj+1].t)))ok=false;
          if(!ok)break;idx.push(pj);j=pj+1;k+=2;continue}
        if(j<T.length&&(T[j].t===p||(k===0&&L[j]===p))){idx.push(j);j++;k++}else{ok=false;break}}
      if(ok&&idx.includes(me)){const n=ps.filter(x=>x!=="~").length;if(!best||n>best.n)best={pat,mean,n,text:txt.slice(T[idx[0]].a,T[idx[idx.length-1]].b)}}}}
  return best}catch(_){return null}}
function closeDict(){const s=document.getElementById("dsheet");if(s)s.remove();document.querySelectorAll(".dhl").forEach(e=>{const p=e.parentNode;while(e.firstChild)p.insertBefore(e.firstChild,e);p.removeChild(e);p.normalize()});if(DICT.onClose){const f=DICT.onClose;DICT.onClose=null;f()}}
const DICT={onClose:null};
function bindDict(el,opt={}){if(!el)return;el.classList.add("dic");el.addEventListener("click",(e)=>{
  if(e.target.closest("button,a,.mk,summary"))return;const hit=wordAt(e.clientX,e.clientY);if(!hit){closeDict();return}
  closeDict();if(opt.onOpen)opt.onOpen();DICT.onClose=opt.onClose||null;
  const ph=phraseAt(el,hit.r);
  const sp=document.createElement("span");sp.className="dhl";try{hit.r.surroundContents(sp)}catch(_){}
  const f=dictFind(hit.w),ms=f?f.m.split(" / "):[];
  const d=document.createElement("div");d.id="dsheet";d.className="dsheet";d.setAttribute("role","dialog");
  d.innerHTML=`<div class="dhd"><p class="dw">${hit.w}</p><button class="dx" id="dx" aria-label="閉じる">×</button></div>
   ${ph?`<div class="dph"><span class="dphl">この文では、まとまりで</span><p class="dpht">${ph.text}${ph.text.toLowerCase().replace(/’/g,"'")!==ph.pat.replace(/ ~/g,"")?`<small>（${ph.pat.replace(/~ing/,"〜ing").replace(/~/g,"〜")}）</small>`:""}</p><p class="dphm">${ph.mean}</p></div><p class="dsub">単語の意味</p>`:""}
   ${f&&f.h!==f.w?`<p class="dbase">もとの形：<b>${f.h}</b></p>`:""}
   ${f?`<ol class="dm">${ms.map(m=>`<li>${m}</li>`).join("")}</ol>`:`<p class="dm0">${jp("辞書にのっていない語です。人の名前や地名かもしれません。")}</p>`}
   <p class="dnote">${jp("辞書の訳です。この文での意味は、前後から考えてみてください。")}</p>`;
  document.body.appendChild(d);d.querySelector("#dx").onclick=closeDict})}

function confetti(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const c=document.getElementById("fx"),x=c.getContext("2d");c.hidden=false;const W=c.width=innerWidth,H=c.height=innerHeight;
  const col=["#f0503c","#1b6ef3","#8a5cf0","#f5b301","#1c9a63"];
  const ps=Array.from({length:90},()=>({x:W/2+(Math.random()-.5)*120,y:H*.32,vx:(Math.random()-.5)*11,vy:-Math.random()*11-3,r:Math.random()*5+3,c:col[Math.floor(Math.random()*5)],a:Math.random()*6}));
  let t=0;(function f(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});
    if(++t<110)requestAnimationFrame(f);else{x.clearRect(0,0,W,H);c.hidden=true}})()}

const boldStrong=(t,strong)=>t.split(" ").map(w=>strong.includes(norm(w))?`<b>${w}</b>`:w).join(" ");

const MRE=/\{([A-Z])\|([^|}]+)\|([^|}]+)(?:\|([^}]+))?\}/g;
const plainT=(t)=>t.replace(MRE,"$2");
const hasContr=(t)=>t.toLowerCase().replace(/’/g,"'").split(/[^a-z']+/).some(w=>LIB.contr.includes(w));
const inGroup=(k,txt,g)=>g==="W"?k==="W":g==="C"?(k==="C"||hasContr(txt)):(g==="L"?["L","D","A","F"].includes(k):false);
const subLabel=(k,g)=>g==="L"?(LIB.types[k]?LIB.types[k][0]:"音のつながり"):GROUP[g];
const subNote=(k,g)=>g==="L"?(LIB.types[k]?LIB.types[k][1]:""):g==="C"&&k!=="C"?GNOTE.C:GNOTE[g];

const nextStory=(s)=>{const a=LIB.stories.filter(x=>x.cat===s.cat);return a[a.indexOf(s)+1]};

  if(t>=pj.to||player.ended){player.pause();const f=pj.end;pj=null;if(f)f()}},40);
const _stop=stop;stop=function(){pj=null;_stop()};
function playSeg(key,from,to,end,tick){stop();markDay();const my=tok,url="audio/"+key+"_"+(S.slow?"s":"n")+".mp3";
  player.defaultPlaybackRate=1;player.playbackRate=1;
  const start=()=>{if(my!==tok)return;try{player.currentTime=from}catch(e){}
    const p=player.play();if(p&&p.catch)p.catch(()=>{});pj={my,to,end,tick}};
  if(curUrl!==url||player.getAttribute("src")!==url){curUrl=url;player.src=url;player.addEventListener("loadedmetadata",start,{once:true});player.load()}else start()}
const marks=(key)=>LIB.audio[key][S.slow?"s":"n"];

/* 文の表示：チャンク（スラッシュ）／指定した種類の印だけ色をつける */
function lineHtml(it,g,showG){
  if(g==="K")return it.ch.map((c,j)=>`<span class="ck">${plainT(c)}${showG&&it.g?`<small>${it.g[j]}</small>`:""}</span>`).join('<span class="sl">/</span>');
  return it.t.replace(MRE,(m,k,en,ka,note)=>inGroup(k,en,g)?`<span class="mk t-${g}" role="button" tabindex="0" data-k="${k}" data-en="${en}" data-ka="${ka}" data-note="${note||""}">${en}</span>`:en)}
function groupCount(st,g){let n=0;st.s.forEach(it=>{for(const m of it.t.matchAll(MRE))if(inGroup(m[1],m[2],g))n++});return n}

    const i=p.i,q=LVQ.rq[i],opts=shuffle(q[1]);
    app.innerHTML=`${BACK}${bar(45+i*8,`パート2　内容チェック　${i+1} / 2`)}<p class="sub">${jp("文章は見ずに答えてください。")}</p><p class="q">${jp(q[0])}</p>
    <div class="stack">${opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join("")}<button class="opt" data-o="" style="color:var(--sub);border-style:dashed">わからない</button></div>`;
    $$("[data-o]").forEach(b=>b.onclick=()=>{R.ra[i]=b.dataset.o;R.r[i]=b.dataset.o===q[1][0];set(i<1?{st:"rq",i:1}:{st:"listen",i:0})});return}
  if(st==="listen"){
    const i=p.i,q=LVQ.listen[i],opts=shuffle(q.o);let plays=0;
    app.innerHTML=`${BACK}${bar(66+i*11,`パート3　聞き取り　${i+1} / 3（${q.lb}）`)}<p class="q">${jp("英文を聞いて、意味を選んでください。")}</p>
    <div class="listen"><button class="big" id="pl" aria-label="聞く"><span class="tri"></span></button><p class="sub" id="pc">2回まで聞けます</p></div>${NOTE}
    <div class="stack" id="ops" hidden>${opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join("")}<button class="opt" data-o="" style="color:var(--sub);border-style:dashed">わからない</button></div>`;
    const pl=$("#pl");pl.onclick=()=>{if(plays>=2||pl.classList.contains("on"))return;plays++;$("#ops").hidden=false;
      $("#pc").textContent=plays>=2?"もう聞けません。意味を選んでください":"あと1回聞けます";play(q.au,()=>{if(plays>=2)pl.disabled=true},pl)};
    $$("[data-o]").forEach(b=>b.onclick=()=>{stop();R.la[i]=b.dataset.o;R.l[i]=b.dataset.o===q.o[0];if(i<2)set({st:"listen",i:i+1});else{const lv=lvJudge(R);S.level=lv;S.checked=true;S.lastLv={wpm:R.wpm,v:R.v.filter(Boolean).length,r:R.r.filter(Boolean).length,l:R.l.filter(Boolean).length,R};save();S.stack=[["home"],["lvresult",{R,lv}]];render()}});return}
},
lvreview({R}){
  const mk=(ok)=>`<span class="rvm ${ok?"o":"x"}">${ok?"○":"×"}</span>`;
  const you=(a)=>a?a:"わからない";
  const row=(ok,qhtml,right,yours)=>`<div class="rvq">${mk(ok)}<div class="rvb">${qhtml}<p class="rva">正解：<b>${right}</b></p>${ok?"":`<p class="rvy">あなたの答え：${you(yours)}</p>`}</div></div>`;
  const sec=(t,n,m,body)=>`<h2 style="font-size:18px;margin-top:8px">${t}<span class="sub" style="margin-left:8px">${n} / ${m}</span></h2><div class="stack" style="gap:10px">${body}</div>`;
  const v=LVQ.vocab.map((q,i)=>row(!!R.v[i],`<p class="ens" style="font-size:20px">${q.en}</p>`,q.o[0],R.va&&R.va[i])).join("");
  const r=LVQ.rq.map((q,i)=>row(!!R.r[i],`<p class="q" style="font-size:16px">${jp(q[0])}</p>`,q[1][0],R.ra&&R.ra[i])).join("");
  const l=LVQ.listen.map((q,i)=>row(!!R.l[i],`<div class="rowsb" style="gap:10px;justify-content:flex-start"><button class="pl" data-au="${q.au}" aria-label="聞く"><span class="tri"></span></button><span class="sub">${q.lb}</span></div><p class="ens" style="font-size:18px">${q.en}</p>${q.nt?`<p class="ja">${jp(q.nt)}</p>`:""}`,q.o[0],R.la&&R.la[i])).join("");
  app.innerHTML=`${BACK}<span class="eyebrow">レベルチェック</span><h2>答え合わせ</h2>
  ${sec("パート1　単語",R.v.filter(Boolean).length,6,v)}
  ${sec("パート2　速読",R.r.filter(Boolean).length,2,r+`<details class="rvp"><summary>読んだ文章をもう一度見る</summary><div class="read"><p>${LVQ.passage.join(" ")}</p></div></details>`)}
  ${sec("パート3　聞き取り",R.l.filter(Boolean).length,3,l)}
  <p class="sub">${jp("聞き取りは、何度でも聞き直せます。英文を見ながら聞いて、どこが聞き取れなかったかを確かめてみてください。")}</p>`;
  $$("[data-au]").forEach(b=>b.onclick=()=>{if(b.classList.contains("on")){stop();return}play(b.dataset.au,null,b)});
  $$(".rvp .read,.rvb .ens").forEach(e=>bindDict(e));
},
lvresult({R,lv}){
  const L=LIB.lv[lv],v=R.v.filter(Boolean).length,ok=R.r.filter(Boolean).length,l=R.l.filter(Boolean).length,tooFast=R.wpm>700;
  const scale=[["初級",LIB.lv.A.target],["初中級",LIB.lv.B.target],["上級",LIB.lv.C.target]],lo=50,mx=230,w=Math.max(lo,Math.min(R.wpm,mx)),pos=(x)=>(x-lo)/(mx-lo)*100;
  app.innerHTML=`<span class="eyebrow">レベルチェックの結果</span>
  <h2>${jp("あなたには「"+L.name+"コース」が、ちょうどいいです。")}</h2>
  <div class="streakbox"><span class="sub">あなたの読む速さ</span>
    <p class="score">${tooFast?"―":R.wpm}<small>語/分</small></p>
    ${tooFast?`<p class="sub">${jp("速すぎて測れませんでした。次は最後まで読んでから押してください。")}</p>`:`<div class="wpmbar"><span class="me" style="left:${pos(w)}%"></span>${scale.map(s=>`<i style="left:${pos(s[1])}%"><b>${s[0]}</b>${s[1]}</i>`).join("")}</div>`}
  </div>
  <div class="stats3" style="grid-template-columns:repeat(3,1fr)"><div><b>${v} / 6</b><span>単語</span></div><div><b>${ok} / 2</b><span>速読の内容</span></div><div><b>${l} / 3</b><span>聞き取り</span></div></div>
  <div class="tips"><p>${jp(L.desc+"の読みものを、チャンクで30話読めます。目標は"+tl(L)+"語/分です。")}</p>
  ${lv!=="C"?`<p>${jp(lv==="A"?"まずは初級コースで、意味をとりながら最後まで読む練習から始めましょう。":"読む速さが150語/分を超え、ドラマの速さの英文が聞き取れるようになったら、上級コースに挑戦してみてください。")}</p>`:`<p>${jp("映画・ドラマの速さについていける力があります。上級コースで200語/分を目指しましょう。")}</p>`}
  <p>${jp("コースは、チャンクの章でいつでも切り替えられます。")}</p></div>
  <button class="btn ghost" id="rv">答え合わせを見る</button>
  <p class="q" style="margin-top:6px">次はどちらから始めますか？</p>
  ${choiceCards()}`;
  bindChoice();$("#rv").onclick=()=>go("lvreview",{R});
}
});

function openMod(m){if(m==="ck")go("ckmenu");else if(m==="fin")go("fin",{pos:0});else if(CFG[m])startQuiz(m);else home()}
function finishQuiz(){const key=Q.key,n=CFG[key].n;let ok=0;for(let i=0;i<n;i++){if(Q.res[i]===1){ok++;S.rec[key][i]=1}else if(S.rec[key][i]!==1)S.rec[key][i]=0}
  save();S.stack=key==="st"?[["home"],["qend",{key,ok,n}]]:[["home"],["ckmenu"],["qend",{key,ok,n}]];render();confetti()}
function finishFinal(){S.stack=[["home"],["ckmenu"],["finend"]];render();confetti()}
function openSheet(m,au){stop();const d=m.dataset,k=KIND[d.k];
  sheet.innerHTML=`<div class="in"><span class="tag t-${d.k}">${k[0]}</span>
    <div class="pair"><span class="e">${d.en}</span><span class="k">${d.ka}</span></div><p class="x">${k[1]}</p>
    <div class="two"><button class="btn" id="sp"><span class="tri"></span><span>この文で聞く</span></button><button class="btn ghost" id="cl">閉じる</button></div></div>`;
  sheet.hidden=false;sheet.querySelector("#sp").onclick=()=>play(au);sheet.querySelector("#cl").onclick=()=>{sheet.hidden=true;stop()}}
render();
</script>
</body>
</html>
